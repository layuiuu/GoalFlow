<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f6ef7">
  <meta name="description" content="GoalFlow 目标流：多目标管理 + 每日任务聚合 + AI 动态调整，数据只存本机">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <title>目标流 GoalFlow</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main id="app">

    <!-- 今日：聚合所有目标的每日任务 -->
    <section class="page active" id="page-today">
      <header class="page-head brand-head">
        <div class="brand-row"><span class="brand-logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M20 8.2A8 8 0 1 0 20 15.8" stroke="#5BC0BE" stroke-width="3.4" stroke-linecap="round"/><path d="M19.6 12H13.8" stroke="#5BC0BE" stroke-width="3.4" stroke-linecap="round"/><circle cx="13" cy="12" r="4.6" stroke="#5BC0BE" stroke-width="1.1" stroke-dasharray="0.9 1.7" opacity=".55"/><path d="M9.5 16.6q2-1.6 4 0t4 0" stroke="#5BC0BE" stroke-width="1.3" stroke-linecap="round" opacity=".75"/></svg></span><span class="brand-name">GoalFlow</span></div>
        <p class="brand-sub">今日 · <span id="today-sub"></span></p>
        <button class="btn ghost sm head-action" data-action="open-review">写复盘</button>
      </header>
      <div class="page-body" id="today-body"></div>
    </section>

    <!-- 目标：多目标管理 -->
    <section class="page" id="page-goals">
      <header class="page-head brand-head">
        <div class="brand-row"><span class="brand-logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M20 8.2A8 8 0 1 0 20 15.8" stroke="#5BC0BE" stroke-width="3.4" stroke-linecap="round"/><path d="M19.6 12H13.8" stroke="#5BC0BE" stroke-width="3.4" stroke-linecap="round"/><circle cx="13" cy="12" r="4.6" stroke="#5BC0BE" stroke-width="1.1" stroke-dasharray="0.9 1.7" opacity=".55"/><path d="M9.5 16.6q2-1.6 4 0t4 0" stroke="#5BC0BE" stroke-width="1.3" stroke-linecap="round" opacity=".75"/></svg></span><span class="brand-name">GoalFlow</span></div>
        <p class="brand-sub">目标 · 管理你的多个目标，每一步都算数 ✨</p>
        <button class="btn primary sm head-action" data-action="new-goal">＋ 新建</button>
      </header>
      <div class="seg" id="goal-seg"></div>
      <div class="page-body" id="goals-body"></div>
    </section>

    <!-- 计划：按日期查看 / 手动编辑 / AI 优化 -->
    <section class="page" id="page-plan">
      <header class="page-head brand-head">
        <div class="brand-row"><span class="brand-logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M20 8.2A8 8 0 1 0 20 15.8" stroke="#5BC0BE" stroke-width="3.4" stroke-linecap="round"/><path d="M19.6 12H13.8" stroke="#5BC0BE" stroke-width="3.4" stroke-linecap="round"/><circle cx="13" cy="12" r="4.6" stroke="#5BC0BE" stroke-width="1.1" stroke-dasharray="0.9 1.7" opacity=".55"/><path d="M9.5 16.6q2-1.6 4 0t4 0" stroke="#5BC0BE" stroke-width="1.3" stroke-linecap="round" opacity=".75"/></svg></span><span class="brand-name">GoalFlow</span></div>
        <p class="brand-sub">计划 · 按日期查看与调整任务</p>
        <button class="btn primary sm head-action" data-action="add-task">＋ 任务</button>
      </header>
      <div id="plan-nav"></div>
      <div class="page-body" id="plan-body"></div>
    </section>

    <!-- 看板：全局汇总 / 分目标 / 对比 -->
    <section class="page" id="page-stats">
      <header class="page-head brand-head">
        <div class="brand-row"><span class="brand-logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M20 8.2A8 8 0 1 0 20 15.8" stroke="#5BC0BE" stroke-width="3.4" stroke-linecap="round"/><path d="M19.6 12H13.8" stroke="#5BC0BE" stroke-width="3.4" stroke-linecap="round"/><circle cx="13" cy="12" r="4.6" stroke="#5BC0BE" stroke-width="1.1" stroke-dasharray="0.9 1.7" opacity=".55"/><path d="M9.5 16.6q2-1.6 4 0t4 0" stroke="#5BC0BE" stroke-width="1.3" stroke-linecap="round" opacity=".75"/></svg></span><span class="brand-name">GoalFlow</span></div>
        <p class="brand-sub">看板 · 进度与完成率一览（本地计算）</p>
      </header>
      <div class="page-body" id="stats-body"></div>
    </section>

    <!-- 设置 -->
    <section class="page" id="page-settings">
      <header class="page-head brand-head">
        <div class="brand-row"><span class="brand-logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M20 8.2A8 8 0 1 0 20 15.8" stroke="#5BC0BE" stroke-width="3.4" stroke-linecap="round"/><path d="M19.6 12H13.8" stroke="#5BC0BE" stroke-width="3.4" stroke-linecap="round"/><circle cx="13" cy="12" r="4.6" stroke="#5BC0BE" stroke-width="1.1" stroke-dasharray="0.9 1.7" opacity=".55"/><path d="M9.5 16.6q2-1.6 4 0t4 0" stroke="#5BC0BE" stroke-width="1.3" stroke-linecap="round" opacity=".75"/></svg></span><span class="brand-name">GoalFlow</span></div>
        <p class="brand-sub">设置 · 预算、AI 与本地数据</p>
      </header>
      <div class="page-body" id="settings-body"></div>
    </section>
  </main>

  <!-- 目标详情（全屏覆盖层） -->
  <section id="goal-detail" class="overlay hidden">
    <header class="detail-head">
      <button class="icon-btn" data-action="close-detail">‹ 返回</button>
      <span class="detail-head-title">目标详情</span>
      <button class="icon-btn" data-action="edit-goal" id="detail-edit-btn">编辑</button>
    </header>
    <div class="page-body" id="detail-body"></div>
  </section>

  <!-- AI 调整预览（全屏覆盖层） -->
  <section id="adjust-preview" class="overlay hidden">
    <header class="detail-head">
      <button class="icon-btn" data-action="close-ap">‹ 返回</button>
      <span class="detail-head-title">🔧 AI 调整预览</span>
    </header>
    <div class="page-body" id="ap-body"></div>
    <div class="ap-footer" id="ap-footer"></div>
  </section>

  <!-- 弹窗与提示 -->
  <div id="modal-mask" class="modal-mask hidden"><div class="modal" id="modal-box"></div></div>
  <div id="toast" class="toast hidden"></div>
  <input type="file" id="import-file" accept=".json,application/json" class="hidden">

  <nav class="tabbar" id="tabbar">
    <button data-action="tab" data-page="today" class="active" aria-label="今日">
      <svg class="nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        <circle class="solid" cx="12" cy="12" r="3.4" fill="currentColor" stroke="none"/>
      </svg>
      <span>今日</span>
    </button>
    <button data-action="tab" data-page="goals" aria-label="目标">
      <svg class="nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
        <circle class="solid" cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/>
      </svg>
      <span>目标</span>
    </button>
    <button data-action="tab" data-page="plan" aria-label="计划">
      <svg class="nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="18" rx="2.5"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="m9 15.5 2 2 4-4"/>
        <rect class="solid" x="3" y="4" width="18" height="5.2" rx="2.5" fill="currentColor" stroke="none"/>
      </svg>
      <span>计划</span>
    </button>
    <button data-action="tab" data-page="stats" aria-label="看板">
      <svg class="nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/>
        <rect class="solid" x="6.6" y="13" width="2.8" height="4" rx="1" fill="currentColor" stroke="none"/>
        <rect class="solid" x="11.6" y="4.5" width="2.8" height="12.5" rx="1" fill="currentColor" stroke="none"/>
        <rect class="solid" x="16.6" y="8.5" width="2.8" height="8.5" rx="1" fill="currentColor" stroke="none"/>
      </svg>
      <span>看板</span>
    </button>
    <button data-action="tab" data-page="settings" aria-label="设置">
      <svg class="nav-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        <circle class="solid" cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/>
      </svg>
      <span>设置</span>
    </button>
  </nav>

  <script src="./js/store.js"></script>
  <script src="./js/rules.js"></script>
  <script src="./js/aggregate.js"></script>
  <script src="./js/ai.js"></script>
  <script src="./js/adjust.js"></script>
  <script src="./js/chart.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
